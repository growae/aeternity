[workspace]
members = ["crates/ae-types", "crates/ae-crypto", "crates/ae-codec", "crates/ae-protocol", "crates/ae-trie", "crates/ae-state", "crates/ae-tx", "crates/ae-consensus", "crates/ae-execution", "crates/ae-vm-aevm", "crates/ae-vm-fate"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
ae-types = { path = "crates/ae-types" }
ae-crypto = { path = "crates/ae-crypto" }
ae-codec = { path = "crates/ae-codec" }
ae-trie = { path = "crates/ae-trie" }
ae-protocol = { path = "crates/ae-protocol" }
ae-tx = { path = "crates/ae-tx" }
ae-state = { path = "crates/ae-state" }
ae-vm-aevm = { path = "crates/ae-vm-aevm" }
ae-vm-fate = { path = "crates/ae-vm-fate" }
blake2 = "=0.10.6"
sha2 = "=0.10.9"
ed25519-dalek = "=2.2.0"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
secp256k1 = { version = "=0.29.1", features = ["recovery"] }
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
bs58 = "=0.5.1"
base64 = "=0.22.1"
hex = "=0.4.3"
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
