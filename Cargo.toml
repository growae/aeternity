[workspace]
members = ["crates/ae-types", "crates/ae-crypto", "crates/ae-codec", "crates/ae-protocol", "crates/ae-trie", "crates/ae-state", "crates/ae-tx", "crates/ae-consensus", "crates/ae-execution", "crates/ae-vm-aevm", "crates/ae-vm-fate", "crates/ae-mempool", "crates/ae-hyperchain", "crates/ae-chain", "crates/ae-storage", "crates/ae-p2p", "crates/ae-sync", "crates/ae-node", "crates/ae-stratum"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }
# Pin the upstream Windows fix that waits for zero active job processes.
process-wrap = { git = "https://github.com/watchexec/process-wrap.git", rev = "2f4bc393d8bd03b4b1c81fee2e13ce82dd42906e", default-features = false, features = ["std", "job-object"] }
ae-sync = { path = "crates/ae-sync" }
aes = { version = "=0.8.4", features = ["zeroize"] }
tokio = { version = "=1.49.0", default-features = false, features = ["rt", "net", "sync", "time", "macros"] }
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-getrandom", "use-curve25519", "use-chacha20poly1305", "use-blake2"] }
curve25519-dalek = "=4.1.3"
zeroize = "=1.9.2"
ae-p2p = { path = "crates/ae-p2p" }
ae-storage = { path = "crates/ae-storage" }
rocksdb = { version = "=0.24.0", default-features = false, features = ["bindgen-runtime", "lz4"] }
ae-consensus = { path = "crates/ae-consensus" }
ae-chain = { path = "crates/ae-chain" }
ae-hyperchain = { path = "crates/ae-hyperchain" }
ae-mempool = { path = "crates/ae-mempool" }
ae-execution = { path = "crates/ae-execution" }
ae-types = { path = "crates/ae-types" }
ae-crypto = { path = "crates/ae-crypto" }
ae-codec = { path = "crates/ae-codec" }
ae-trie = { path = "crates/ae-trie" }
ae-protocol = { path = "crates/ae-protocol" }
ae-tx = { path = "crates/ae-tx" }
ae-state = { path = "crates/ae-state" }
ae-vm-aevm = { path = "crates/ae-vm-aevm" }
ae-vm-fate = { path = "crates/ae-vm-fate" }
blake2 = "=0.10.6"
sha2 = "=0.10.9"
sha1 = "=0.10.6"
rand = "=0.8.5"
ed25519-dalek = "=2.2.0"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }
secp256k1 = { version = "=0.29.1", features = ["recovery"] }
num-bigint = "=0.4.6"
num-traits = "=0.2.19"
bs58 = "=0.5.1"
base64 = "=0.22.1"
hex = "=0.4.3"
serde_json = { version = "=1.0.149", features = ["arbitrary_precision"] }
httparse = "=1.10.1"
roxmltree = "=0.21.1"
netdev = { version = "=0.47.0", default-features = false, features = ["gateway"] }
url = "=2.5.9"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
